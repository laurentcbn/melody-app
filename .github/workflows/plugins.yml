# Met à jour la liste des plugins gratuits (plugins.json) lue par Melody.
name: Plugins gratuits

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**, .github/workflows/plugins.yml]

permissions:
  contents: write

concurrency: plugins

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Chercher sur GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/discover.py plugins.json
      - name: Publier
        run: |
          git config user.name "melody-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins.json
          git diff --cached --quiet && exit 0
          git commit -m "Liste des plugins gratuits mise à jour"
          git push
